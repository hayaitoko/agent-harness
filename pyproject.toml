[project]
name = "artoo"
version = "2.24.0"
description = "Personal AI agent. OpenRouter-routed boss + worker tree, ZDR end-to-end."
requires-python = ">=3.11"
authors = [{ name = "Artoo contributors" }]
dependencies = [
  "python-telegram-bot>=21.6",
  "qdrant-client>=1.15",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "croniter>=3.0",
  "mcp>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",           # round_pipeline VERIFY phase reads .artoo/verify.yml
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.0",   # local STT
  "piper-tts>=1.2",        # local TTS
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
artoo = "artoo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["artoo"]
